name: pwc_mobile
description: Personal PWC identity client. No NGO-private authority is inferred.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.35.7"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 16.3.0
  flutter_secure_storage: 9.2.4
  http: 1.5.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Noto Sans Arabic Variable
      fonts:
        - asset: assets/fonts/NotoSansArabicVariable.ttf
