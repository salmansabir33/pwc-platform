name: PWC mobile Flutter CI
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - .github/workflows/flutter-environment.yml
      - scripts/flutter_environment_probe.py
      - scripts/mobile_*.py
      - packages/api-contracts/**
      - apps/mobile/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/flutter-environment.yml
      - scripts/flutter_environment_probe.py
      - scripts/mobile_*.py
      - packages/api-contracts/**
      - apps/mobile/**
  workflow_dispatch:
concurrency:
  group: pwc-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    name: PWC mobile locked dependencies, format, contracts, analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned stable Flutter with maintained v2 action
        id: setup
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          architecture: x64
          cache: "false"
          pub-cache: "false"
      - name: Verify installed upstream revision and print versions
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          flutter --version
          dart --version
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert data['frameworkVersion'] == '3.35.7', data
          assert data['channel'] == 'stable', data
          assert data['dartSdkVersion'] == '3.9.2', data
          assert data['frameworkRevision'] == 'adc901062556672b4138e18a4dc62a4be8f4b3c2', data
          print(f"::notice title=Verified SDK::Flutter {data['frameworkVersion']}; Dart {data['dartSdkVersion']}; revision {data['frameworkRevision']}")
          PYTHON
      - name: Flutter doctor (report platform limitations honestly)
        run: |
          set -euo pipefail
          flutter doctor -v | tee "$RUNNER_TEMP/flutter-doctor.txt"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'flutter-doctor.txt').read_text().splitlines()
          findings = [line for line in lines if line.startswith(('[✓]', '[!]', '[✗]', '[√]'))]
          assert findings, 'No doctor findings captured'
          print('::notice title=Doctor findings::' + ' | '.join(findings))
          PYTHON
      - name: Verify pub.dev registry HTTPS and metadata
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 2 --connect-timeout 15 --max-time 60 \
            https://pub.dev/api/packages/flutter_lints \
            --output "$RUNNER_TEMP/pub-registry.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pub-registry.json').read_text())
          assert data['name'] == 'flutter_lints'
          print(f"::notice title=Registry HTTPS::pub.dev flutter_lints metadata retrieved; latest {data['latest']['version']}")
          PYTHON
      - name: Resolve actual PWC dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Check actual PWC Dart formatting without rewriting
        id: dart_format
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Suggest formatting correction only on failed format gate
        if: failure() && steps.dart_format.outcome == 'failure'
        working-directory: apps/mobile
        run: |
          dart format lib test integration_test
          python3 - <<'PYTHON'
          import base64, gzip, subprocess
          patch=subprocess.check_output(['git','diff','--','lib','test','integration_test'])
          encoded=base64.b64encode(gzip.compress(patch)).decode()
          chunks=[encoded[i:i+3900] for i in range(0,len(encoded),3900)]
          assert len(chunks)<=8, 'Formatting suggestion exceeds bounded source budget'
          for i,chunk in enumerate(chunks):
              print(f'::notice title=PWC format suggestion {i+1}/{len(chunks)}::{chunk}')
          PYTHON
      - name: Check canonical mobile contract generation
        run: python3 scripts/mobile_contracts.py --check
      - name: Analyze actual PWC source
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/pwc-analyze.txt"
      - name: Test actual PWC contracts
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter test --no-pub --coverage --reporter expanded 2>&1 | tee "$RUNNER_TEMP/pwc-tests.txt"
      - name: Resolve dependency advisory and license evidence
        run: python3 scripts/mobile_dependency_review.py
      - name: Bounded source diagnostics
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ('pwc-analyze.txt','pwc-tests.txt'):
              path=Path(os.environ['RUNNER_TEMP'])/name
              if path.exists():
                  text=path.read_text()[-12000:]
                  for index in range(0,len(text),3000):
                      chunk=text[index:index+3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print(f'::notice title={name} {index//3000+1}::{chunk}')
          PYTHON

      - name: Retain Flutter line coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Actual PWC Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: "false"
          pub-cache: "false"
      - name: Provision pinned Flutter Android prerequisites
        run: |
          set -euo pipefail
          java -version
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > "$RUNNER_TEMP/pwc-android-licenses.txt"
          result=${PIPESTATUS[1]}
          set -o pipefail
          test "$result" -eq 0
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Resolve actual PWC mobile packages
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Build actual PWC Android debug APK
        working-directory: apps/mobile
        run: |
          set -o pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/pwc-android-build.txt"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Compile native integration harness (not a device test)
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub --target=integration_test/credential_lifecycle_test.dart 2>&1 | tee -a "$RUNNER_TEMP/pwc-android-build.txt"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Review resolved Android runtime advisories
        run: python3 scripts/mobile_android_review.py
      - name: Bounded Android build evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'pwc-android-build.txt'
          if p.exists():
              text=p.read_text()[-16000:]
              for i in range(0,len(text),3500):
                  chunk=text[i:i+3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::notice title=PWC Android build {i//3500+1}::{chunk}')
          PYTHON
