name: PWC mobile Flutter CI
on:
  push:
    branches: [main, arena/f54f895c-pwc-platform]
    paths:
      - .github/workflows/flutter-environment.yml
      - scripts/flutter_environment_probe.py
      - scripts/mobile_*.py
      - packages/api-contracts/**
      - apps/mobile/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/flutter-environment.yml
      - scripts/flutter_environment_probe.py
      - scripts/mobile_*.py
      - packages/api-contracts/**
      - apps/mobile/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Actual PWC mobile source validation (bootstrap checkpoint)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned stable Flutter with maintained v2 action
        id: setup
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          architecture: x64
          cache: "false"
          pub-cache: "false"
      - name: Verify installed upstream revision and print versions
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          flutter --version
          dart --version
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert data['frameworkVersion'] == '3.35.7', data
          assert data['channel'] == 'stable', data
          assert data['frameworkRevision'] == 'adc901062556672b4138e18a4dc62a4be8f4b3c2', data
          print(f"::notice title=Verified SDK::Flutter {data['frameworkVersion']}; Dart {data['dartSdkVersion']}; revision {data['frameworkRevision']}")
          PYTHON
      - name: Flutter doctor (report platform limitations honestly)
        run: |
          set -euo pipefail
          flutter doctor -v | tee "$RUNNER_TEMP/flutter-doctor.txt"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'flutter-doctor.txt').read_text().splitlines()
          findings = [line for line in lines if line.startswith(('[✓]', '[!]', '[✗]', '[√]'))]
          assert findings, 'No doctor findings captured'
          print('::notice title=Doctor findings::' + ' | '.join(findings))
          PYTHON
      - name: Verify pub.dev registry HTTPS and metadata
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 2 --connect-timeout 15 --max-time 60 \
            https://pub.dev/api/packages/flutter_lints \
            --output "$RUNNER_TEMP/pub-registry.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pub-registry.json').read_text())
          assert data['name'] == 'flutter_lints'
          print(f"::notice title=Registry HTTPS::pub.dev flutter_lints metadata retrieved; latest {data['latest']['version']}")
          PYTHON
      - name: Bootstrap native project source (temporary acquisition checkpoint)
        run: |
          flutter create --no-pub --org=pk.org.pwc --platforms=android,ios --project-name=pwc_mobile "$RUNNER_TEMP/pwc_native"
          cp -Rn "$RUNNER_TEMP/pwc_native/android" "$RUNNER_TEMP/pwc_native/ios" apps/mobile/
          cp "$RUNNER_TEMP/pwc_native/.metadata" apps/mobile/
      - name: Resolve actual PWC dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Canonicalize actual project Dart source (bootstrap only)
        working-directory: apps/mobile
        run: |
          dart fix --apply
          dart format lib test
      - name: Capture source-only native templates and real lockfile
        run: python3 scripts/mobile_ci_evidence.py
      - name: Analyze actual PWC source
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/pwc-analyze.txt"
      - name: Test actual PWC contracts
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/pwc-tests.txt"
      - name: Bounded source diagnostics
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ('pwc-analyze.txt','pwc-tests.txt'):
              path=Path(os.environ['RUNNER_TEMP'])/name
              if path.exists():
                  text=path.read_text()[-12000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::notice title={name}::{text}')
          PYTHON
