name: Web foundation checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwc_synthetic_web
          POSTGRES_USER: pwc
          POSTGRES_PASSWORD: test-only-browser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pwc -d pwc_synthetic_web"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PWC_ENVIRONMENT: test
      DJANGO_SECRET_KEY: test-only-browser-secret-not-production
      DB_NAME: pwc_synthetic_web
      DB_USER: pwc
      DB_PASSWORD: test-only-browser-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      PYTHONPATH: apps/backend
      PWC_PUBLIC_API_TARGET: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts npm@10.9.8
      - run: node --version && test "$(npm --version)" = "10.9.8"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run contracts:types:check
      - run: npm run check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prepare actual PostgreSQL public projection for browser integration
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python apps/backend/manage.py migrate --noinput
          python tests/end-to-end/seed_public_directory.py
      - run: npx playwright install --with-deps chromium
      - name: Direct TLS synthetic authenticated browser to Django and PostgreSQL
        run: |
          npx vite build --config tests/end-to-end/auth-harness/vite.config.ts
          python -m unittest discover -s tests/deployment -v
          python tests/end-to-end/authenticated-workspace.py
      - run: npm run test:browser
      - name: Redacted browser count evidence
        run: |
          python3 - <<'PYTHON'
          from xml.etree import ElementTree
          root = ElementTree.parse('coverage/browser-junit.xml').getroot()
          print('::notice title=Browser execution evidence::' + ', '.join(key + '=' + root.attrib.get(key, '?') for key in ('tests', 'failures', 'errors', 'skipped')))
          PYTHON
      - name: Retain web test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-test-results
          path: |
            coverage/*-junit.xml
            coverage/design-system/*.png
          retention-days: 7
          if-no-files-found: warn
