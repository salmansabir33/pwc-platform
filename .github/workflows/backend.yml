name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwc_test
          POSTGRES_USER: pwc
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pwc -d pwc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: test-only-ci-secret-not-for-production
      DB_NAME: pwc_test
      DB_USER: pwc
      DB_PASSWORD: test-only-ci-password
      DB_HOST: localhost
      DB_PORT: 5432
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            packages/api-contracts/requirements.txt
      - run: pip install -r requirements.txt -r ../../packages/api-contracts/requirements.txt
      - run: pip check
      - run: python -m contracts.check --check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py migrate --check
      - run: python manage.py test --testrunner contracts.testing.ContractRunner --verbosity 2
