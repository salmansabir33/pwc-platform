name: Backend checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwc_test
          POSTGRES_USER: pwc
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pwc -d pwc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PWC_ENVIRONMENT: test
      DJANGO_SECRET_KEY: test-only-ci-secret-not-for-production
      DB_NAME: pwc_test
      DB_USER: pwc
      DB_PASSWORD: test-only-ci-password
      DB_HOST: localhost
      DB_PORT: 5432
    defaults:
      run:
        working-directory: apps/backend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-tooling.txt
            apps/backend/requirements.txt
            packages/api-contracts/requirements.txt
      - run: python -m pip install --require-hashes -r ../../requirements-ci.lock
      - run: pip check
      - run: python -m contracts.check --check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --plan
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - name: Offline tooling and scoped quality gates
        if: matrix.python == '3.12'
        working-directory: .
        run: |
          python -m scripts.python_lock --check
          python scripts/security_checks.py
          python -m unittest discover -s tests/tooling -v
          ruff check apps/backend scripts tests/tooling
          ruff check --select E4,E7,E9,F apps/backend/config/environment.py apps/backend/accounts/test_environment.py scripts/security_checks.py scripts/python_dependency_review.py scripts/python_lock.py tests/tooling
          ruff format --check apps/backend/config/environment.py apps/backend/accounts/test_environment.py scripts/security_checks.py scripts/python_dependency_review.py scripts/python_lock.py tests/tooling
      - name: Review Python advisories (runtime and tooling)
        if: matrix.python == '3.12'
        working-directory: .
        run: python scripts/python_dependency_review.py
      - run: coverage run --source=accounts,access,organizations,config,contracts manage.py test --testrunner contracts.testing.ContractRunner --verbosity 2
      - name: Backend coverage evidence
        if: always() && hashFiles('apps/backend/.coverage') != ''
        run: coverage xml -o coverage.xml && coverage report
      - name: Retain backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ matrix.python }}
          path: apps/backend/coverage.xml
          retention-days: 7
          if-no-files-found: warn
