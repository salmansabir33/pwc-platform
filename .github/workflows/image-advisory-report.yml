name: Retained image advisory evidence
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Staging workflow run containing retained synthetic scanner reports
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: staging-foundation-synthetic
          run-id: ${{ inputs.run_id || '41990060923' }}
          github-token: ${{ github.token }}
          path: .cache/retained-scans
      - name: Extract only public package advisory fields (not a replacement security gate)
        run: python infra/staging/advisory_report.py .cache/retained-scans .cache/public-advisories.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-image-advisories
          path: .cache/public-advisories.json
          retention-days: 7
          if-no-files-found: error
